name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.repository == 'KamilBakDev/ai-agent-runtime'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/Dockerfile
          push: ${{ github.repository == 'KamilBakDev/ai-agent-runtime' }}
          tags: |
            ghcr.io/kamilbakdev/ai-agent-runtime:latest
            ghcr.io/kamilbakdev/ai-agent-runtime:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
