services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-runtime-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_runtime}
      POSTGRES_USER: ${POSTGRES_USER:-agent_runtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_runtime}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent_runtime}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-runtime-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agent-runtime-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: agent-runtime-api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agent_runtime}:${POSTGRES_PASSWORD:-agent_runtime}@postgres:5432/${POSTGRES_DB:-agent_runtime}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-agent_runtime}:${POSTGRES_PASSWORD:-agent_runtime}@postgres:5432/${POSTGRES_DB:-agent_runtime}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: agent-runtime-ui
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    env_file:
      - ../.env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_storage:
